<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoría — Protocolo Cruz Maya</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@100;300;400&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0A0A0A; --white: #FFFFFF; --grey-base: 232, 232, 232; --accent: #2E8B57;
            --font-serif: 'Playfair Display', serif; --font-mono: 'Space Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--white); color: var(--black); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at center, #ffffff 0%, #e0e0e0 100%); }
        
        nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo-nav { width: 120px; height: auto; }
        .back-link { font-family: var(--font-mono); font-size: 0.7rem; text-decoration: none; color: #666; text-transform: uppercase; letter-spacing: 2px; }

        header { text-align: center; padding: 60px 20px 40px 20px; border-bottom: 1px solid #eee; }
        header h1 { font-family: var(--font-serif); font-size: 3rem; font-weight: 400; }
        header p { font-family: var(--font-mono); color: var(--accent); font-size: 0.8rem; letter-spacing: 3px; margin-top: 10px; }

        .shop-container { max-width: 1200px; margin: 60px auto; padding: 0 40px; min-height: 50vh; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }

        .product-card {
            background: rgba(255,255,255,0.8); border: 1px solid #eee;
            padding: 20px; transition: all 0.3s; display: flex; flex-direction: column;
        }
        .product-card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.05); transform: translateY(-5px); border-color: var(--accent); }
        .product-img { width: 100%; height: 200px; object-fit: contain; margin-bottom: 20px; mix-blend-mode: multiply; }
        .product-cat { font-family: var(--font-mono); font-size: 0.6rem; text-transform: uppercase; color: #999; margin-bottom: 5px; }
        .product-title { font-family: var(--font-serif); font-size: 1.1rem; margin-bottom: 10px; color: var(--black); }
        .product-desc { font-size: 0.9rem; color: #555; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; }
        
        .btn-buy {
            background: var(--black); color: var(--white); text-decoration: none;
            display: block; text-align: center; padding: 15px;
            font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 2px;
            transition: opacity 0.3s;
        }
        .btn-buy:hover { opacity: 0.8; background: var(--accent); }

        footer { background-color: var(--black); color: var(--white); padding: 60px 80px; text-align: center; font-family: var(--font-mono); font-size: 0.6rem; opacity: 0.5; }
        @media (max-width: 600px) { header h1 { font-size: 2rem; } .products-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <nav>
        <a href="index.html"><img src="img/logo.png" alt="Logo" class="logo-nav"></a>
        <a href="shop.html" class="back-link">&larr; VOLVER A LA TIENDA</a>
    </nav>

    <header>
        <h1 id="page-title">Categoría</h1>
        <p>INVENTARIO SELECCIONADO</p>
    </header>

    <main class="shop-container">
        <div id="grid-productos" class="products-grid">
            <p style="font-family: var(--font-mono); grid-column: 1/-1; text-align: center;">Consultando base de datos...</p>
        </div>
    </main>

    <footer>&copy; 2026 PROTOCOLO CRUZ MAYA</footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const categoriaElegida = params.get('cat'); 
        document.getElementById('page-title').innerText = categoriaElegida || "Colección";

        fetch('productos.json')
            .then(response => response.json())
            .then(data => {
                const grid = document.getElementById('grid-productos');
                grid.innerHTML = ''; 
                const productosFiltrados = data.filter(prod => prod.categoria.toUpperCase() === categoriaElegida.toUpperCase());

                if(productosFiltrados.length === 0) {
                    grid.innerHTML = '<p>No hay productos disponibles en esta categoría aún.</p>';
                    return;
                }

                productosFiltrados.forEach(prod => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-cat">${prod.categoria}</div>
                        <img src="${prod.imagen}" alt="${prod.nombre}" class="product-img">
                        <h3 class="product-title">${prod.nombre}</h3>
                        <p class="product-desc">${prod.descripcion}</p>
                        <a href="${prod.enlace}" target="_blank" class="btn-buy">ADQUIRIR EN AMAZON</a>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(error => console.error('Error:', error));

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let points = []; let mouse = { x: 0, y: 0 };
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            points = [];
            for(let i=0; i<65; i++) points.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });
        }
        window.addEventListener('mousemove', (e) => { mouse.x = (e.clientX - canvas.width/2) * 0.05; mouse.y = (e.clientY - canvas.height/2) * 0.05; });
        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(46, 139, 87, 0.3)"; ctx.fillStyle = "rgba(0,0,0,0.12)";
            points.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
                let tx = p.x + mouse.x; let ty = p.y + mouse.y;
                ctx.beginPath(); ctx.arc(tx, ty, 1.8, 0, Math.PI*2); ctx.fill();
                for(let j=i+1; j<points.length; j++) {
                    let p2 = points[j];
                    let dist = Math.hypot(p.x-p2.x, p.y-p2.y);
                    if(dist < 210) { ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(p2.x + mouse.x, p2.y + mouse.y); ctx.stroke(); }
                }
            });
            requestAnimationFrame(animate);
        }
        init(); animate(); window.addEventListener('resize', init);
    </script>
</body>
</html>
