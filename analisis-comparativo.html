<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronía de Energías — Protocolo Cruz Maya</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;400&family=Space+Mono&display=swap" rel="stylesheet">
    <script src="precios.js"></script>
    <style>
        :root {
            --black: #0A0A0A;
            --white: #FFFFFF;
            --grey-zone: #EAEAEA;
            --accent: #2E8B57;
            --font-serif: 'Playfair Display', serif;
            --font-mono: 'Space Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--white); color: var(--black); font-family: var(--font-sans); 
            overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh;
        }

        #bg-canvas { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background: radial-gradient(circle at center, #ffffff 0%, #e5e5e5 100%); 
        }

        nav.main-nav { 
            position: absolute; top: 40px; right: 50px; display: flex; gap: 35px; z-index: 100; 
        }
        nav.main-nav a { 
            text-decoration: none; color: var(--black); font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; 
        }

        header { 
            padding: 60px 0; display: flex; justify-content: center; align-items: center; 
        }
        .logo-nav { 
            width: 160px; height: auto; cursor: pointer; 
        }

        .title-strip { 
            background-color: var(--grey-zone); width: 100vw; padding: 30px 0; margin-bottom: 50px; 
            text-align: center; border-top: 1px solid rgba(0,0,0,0.05); border-bottom: 1px solid rgba(0,0,0,0.05); 
            position: relative; z-index: 1; 
        }
        .title-strip h2 { 
            font-family: var(--font-serif); font-size: 2.4rem; font-weight: 400; margin-bottom: 15px; 
        }
        .title-strip h2 i { color: var(--accent); }

        .marketing-subliminal { 
            font-family: var(--font-serif); font-style: italic; font-size: 1rem; color: #555; 
            line-height: 1.6; max-width: 500px; margin: 0 auto; padding: 0 20px;
        }

        .form-wrapper { 
            flex: 1; display: flex; justify-content: center; align-items: center; padding-bottom: 80px; 
        }
        .config-card { 
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); 
            border: 1px solid rgba(0,0,0,0.1); width: 100%; max-width: 550px; padding: 50px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.03); text-align: center; 
        }
        .decor-img-small { 
            width: 100px; height: auto; margin-bottom: 30px; opacity: 0.85; filter: grayscale(100%); 
        }
        .form-group { 
            margin-bottom: 25px; text-align: left; 
        }
        .form-group label { 
            display: block; font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 2px; 
            text-transform: uppercase; margin-bottom: 10px; opacity: 0.7; 
        }
        input, select { 
            width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(0,0,0,0.15); 
            padding: 10px 0; font-family: var(--font-sans); font-size: 1rem; transition: 0.3s; 
        }
        input:focus, select:focus { 
            outline: none; border-bottom: 1px solid var(--accent); 
        }
        select { appearance: none; cursor: pointer; }
        
        .separator { 
            border: 0; border-top: 1px dashed #ccc; margin: 30px 0; 
        }
        .btn-generate { 
            width: 100%; background: var(--black); color: var(--white); border: none; padding: 20px; 
            margin-top: 15px; font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 4px; 
            text-transform: uppercase; cursor: pointer; transition: 0.4s; 
        }
        .btn-generate:hover { 
            background: var(--accent); letter-spacing: 6px; 
        }

        footer { 
            background-color: var(--black); color: var(--white); padding: 40px 80px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .footer-brand { display: flex; flex-direction: column; align-items: center; }
        .protocolo-f { 
            font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 10px; text-transform: uppercase; opacity: 0.5; 
        }
        .cruzmaya-f { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; }
        .footer-nav a { 
            color: rgba(255,255,255,0.3); text-decoration: none; font-family: var(--font-mono); 
            font-size: 0.65rem; margin-left: 35px; letter-spacing: 1px; 
        }

        @media (max-width: 850px) { 
            footer { flex-direction: column; gap: 20px; padding: 30px; } 
            header { padding: 30px 0; } 
            .config-card { padding: 40px 30px; } 
        }
    </style>
</head>
<body oncontextmenu="return false">
<script>
document.onkeydown = function(e) {
    if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) {
        return false;
    }
};
</script>

    <canvas id="bg-canvas"></canvas>

    <nav class="main-nav">
        <a href="index.html">Inicio</a>
        <a href="aprender.html">Nosotros</a>
        <a href="shop.html">Shop</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <header>
        <img src="img/logo.png" alt="Logo" class="logo-nav" onclick="window.location.href='index.html'">
    </header>

    <section class="title-strip">
        <h2>Sincronización de <i>Energías</i></h2>
        <p class="marketing-subliminal">Dos matrices que chocan no es un problema, es la falta de un mapa de resonancia. Conocer la intersección de ambas energías es la clave para dejar de exigirte y empezar a fluir juntos.</p>
    </section>

    <main class="form-wrapper">
        <div class="config-card">
            <img src="img/comparativa.jpg" alt="Sincronía" class="decor-img-small">
            
            <form id="form-comparativo">
                <div class="form-group">
                    <label>Identidad Persona A</label>
                    <input type="text" name="nombreA" placeholder="Nombre completo" required>
                    <input type="date" name="fechaA" required style="margin-top: 10px;">
                </div>

                <hr class="separator">

                <div class="form-group">
                    <label>Identidad Persona B</label>
                    <input type="text" name="nombreB" placeholder="Nombre completo" required>
                    <input type="date" name="fechaB" required style="margin-top: 10px;">
                </div>

                <div class="form-group">
                    <label>Tipo de Vínculo</label>
                    <select name="tipo_comparativa" required>
                        <option value="" disabled selected>Seleccione la naturaleza del vínculo...</option>
                        <option value="pareja">Pareja / Alianza de Vida</option>
                        <option value="negocios">Socios / Alianza Comercial</option>
                        <option value="familia">Padres / Hijos / Linaje</option>
                        <option value="amigos">Amigos / Colaboradores</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Entrega del Documento</label>
                    <input type="email" name="email" placeholder="Email para recibir tu informe PDF" required>
                </div>

                <div class="form-group">
                    <label>Código promocional</label>
                    <input type="text" name="codigo_acceso" placeholder="Código de acceso (opcional)">
                </div>

                <!-- BOTÓN DE PAGO CON STRIPE + CÓDIGO MAESTRO -->
                <button type="button" class="btn-generate" onclick="pagarComparativo()">PAGAR Y DECODIFICAR — $<span id="precio-comparativa">18</span></button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-brand">
            <span class="protocolo-f">PROTOCOLO</span>
            <span class="cruzmaya-f">Cruz Maya</span>
        </div>
        <div class="footer-nav">
            <a href="index.html">Inicio</a>
            <a href="about.html">Nosotros</a>
            <a href="shop.html">Shop</a>
        </div>
    </footer>

    <script>
        // Actualizar precio en botón si existe
        if (typeof precios !== 'undefined') {
            const spanPrecio = document.getElementById('precio-comparativa');
            if (spanPrecio) spanPrecio.textContent = precios.comparativa;
        }

        const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let points = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight; points = [];
            for(let i=0; i<60; i++) points.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3 });
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height); ctx.strokeStyle = "rgba(46, 139, 87, 0.2)"; ctx.fillStyle = "rgba(0,0,0,0.1)";
            points.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 1.2, 0, Math.PI*2); ctx.fill();
                for(let j=i+1; j<points.length; j++) {
                    let p2 = points[j]; let dist = Math.hypot(p.x-p2.x, p.y-p2.y);
                    if(dist < 180) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
                }
            });
            requestAnimationFrame(animate);
        }
        init(); animate(); window.addEventListener('resize', init);

        async function pagarComparativo() {
            const nombreA = document.querySelector('[name="nombreA"]').value.trim();
            const fechaA  = document.querySelector('[name="fechaA"]').value;
            const nombreB = document.querySelector('[name="nombreB"]').value.trim();
            const fechaB  = document.querySelector('[name="fechaB"]').value;
            const tipo    = document.querySelector('[name="tipo_comparativa"]').value;
            const email   = document.querySelector('[name="email"]').value.trim();
            const codigo  = document.querySelector('[name="codigo_acceso"]').value.trim();

            if (!nombreA || !fechaA || !nombreB || !fechaB || !tipo || !email) {
                alert("Por favor completa todos los campos."); return;
            }
            const pA = fechaA.split('-');
            const pB = fechaB.split('-');

            // Verificar código maestro
            if (codigo) {
                const respuesta = await fetch('/api/verificar-codigo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codigo: codigo })
                });
                const resultado = await respuesta.json();
                if (resultado.valido) {
                    const datosRegistro = {
                        nombre: nombreA,
                        email: email,
                        fechaNacimiento: fechaA,
                        tipoAnalisis: tipo,
                        monto: "0",
                        moneda: "USD",
                        medioPago: "Código Maestro",
                        nombreB: nombreB,
                        fechaNacB: fechaB
                    };
                    navigator.sendBeacon('https://script.google.com/macros/s/AKfycbxR9KUxjTiHetSCZ1SdPml2nSny7Aw4lgRNCqkniJkfZq0HAKMlM1lgDrhYkUeOelAYRQ/exec', JSON.stringify(datosRegistro));
                    const params = new URLSearchParams({
                        nombreA, diaA: pA[2], mesA: pA[1], anioA: pA[0],
                        nombreB, diaB: pB[2], mesB: pB[1], anioB: pB[0],
                        tipo_comparativa: tipo, email
                    });
                    window.location.href = "resultado-comparativo.html?" + params.toString();
                    return;
                }
            }

            // Flujo normal de Stripe
            const datosRegistro = {
                nombre: nombreA,
                email: email,
                fechaNacimiento: fechaA,
                tipoAnalisis: tipo,
                monto: precios.comparativa.toString(),
                moneda: "USD",
                medioPago: "Stripe",
                nombreB: nombreB,
                fechaNacB: fechaB
            };
            navigator.sendBeacon('https://script.google.com/macros/s/AKfycbxR9KUxjTiHetSCZ1SdPml2nSny7Aw4lgRNCqkniJkfZq0HAKMlM1lgDrhYkUeOelAYRQ/exec', JSON.stringify(datosRegistro));

            const res = await fetch('/api/crear-checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    analisis: 'comparativa',
                    nombre: nombreA,
                    email: email,
                    fechaNacA: fechaA,
                    fechaNacB: fechaB,
                    tipoAnalisis: tipo,
                    precio: precios.comparativa.toString()
                })
            });
            const data = await res.json();
            if (data.url) {
                window.location.href = data.url;
            } else {
                alert("Error al iniciar el pago. Inténtelo de nuevo.");
            }
        }
    </script>
</body>
