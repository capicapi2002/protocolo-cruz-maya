        #bg-canvas {

            top: 0; left: 0; width: 100%; height: 100%;

        nav.main-nav {
            position: absolute;
            top: 40px; right: 50px;
            display: flex; gap: 35px;
            z-index: 100;
        }
        nav.main-nav a {
            text-decoration: none;
            color: var(--black);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        header {
            height: 25vh;
            display: flex;
            justify-content: center;

        .logo-small { width: 170px; height: auto; cursor: pointer; }

        .intro-zone {
            background-color: var(--grey-zone);
            padding: 40px 20px;

            margin: 40px 0;
            border-top: 1px solid rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.05);

        }

            font-weight: 400;
        }

        .form-strip {
            background-color: var(--black);
            color: var(--white);
            padding: 100px 0;
            position: relative;
            z-index: 1;
        }
        .form-container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 80px;
            padding: 0 40px;
        }

        .group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .group label { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 2px; opacity: 0.5; }
        .group input, .group textarea {
            background: rgba(255,255,255,0.03);
            border: 1px solid #333;
            padding: 15px;
            color: white;
            font-family: 'Inter', sans-serif;
            width: 100%;
        }
        .group input:focus, .group textarea:focus { border-color: var(--accent); outline: none; }

        .submit-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .btn-brain {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            background: url('img/cerebro electornico.png') center/cover;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.5s;
        }
        .btn-brain::before {
            content: 'ENVIAR_';
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: white;
            z-index: 2;
        }
        .btn-brain:hover {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(46, 139, 87, 0.3);
        }

        .email-display {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 1px;
            text-decoration: none;
            margin-top: 10px;
        }

        .social-area {
            padding: 80px 0;
            text-align: center;
        }
        .social-area h4 { font-family: var(--font-mono); font-size: 0.7rem; opacity: 0.4; letter-spacing: 4px; margin-bottom: 40px; }
        .icons { display: flex; justify-content: center; gap: 40px; }
        .icons a { color: black; font-size: 1.8rem; transition: 0.3s; }
        .icons a:hover { color: var(--accent); transform: translateY(-3px); }

        footer {
            background-color: var(--black);
            color: var(--white);
            padding: 60px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;

        .footer-brand { display: flex; flex-direction: column; align-items: center; }
        .protocolo-f { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 12.8px; text-transform: uppercase; opacity: 0.5; margin-right: -12.8px; }
        .cruzmaya-f { font-family: var(--font-serif); font-size: 2.4rem; font-weight: 400; line-height: 1; }

        @media (max-width: 850px) {

        }

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        let mouse = { x: 0, y: 0 };
        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            points = [];
            for(let i=0; i<65; i++) {
                points.push({
                    x: Math.random()*canvas.width,
                    y: Math.random()*canvas.height,
                    vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5
                });
            }
        }
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX - canvas.width/2) * 0.05;
            mouse.y = (e.clientY - canvas.height/2) * 0.05;
        });
        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(46, 139, 87, 0.3)";
            ctx.fillStyle = "rgba(0,0,0,0.12)";
            points.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>canvas.width) p.vx*=-1;
                if(p.y<0 || p.y>canvas.height) p.vy*=-1;
                let tx = p.x + mouse.x; let ty = p.y + mouse.y;
                ctx.beginPath(); ctx.arc(tx, ty, 1.8, 0, Math.PI*2); ctx.fill();
                for(let j=i+1; j<points.length; j++) {
                    let p2 = points[j];
                    let dist = Math.hypot(p.x-p2.x, p.y-p2.y);
                    if(dist < 210) {
                        ctx.beginPath(); ctx.moveTo(tx, ty);
                        ctx.lineTo(p2.x + mouse.x, p2.y + mouse.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        init(); animate();
        window.addEventListener('resize', init);
    </script>
